<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Daystrom Command</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com; media-src 'self' blob: mediastream:;" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background:
          radial-gradient(circle at 50% 32%, rgba(201,185,154,.12), transparent 30%),
          #0B0A0D;
        color: #E8DDC8;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      #cth-splash::before,
      #cth-splash::after {
        content: ""; position: absolute; left: 8%; right: 8%; height: 10px;
        border-radius: 999px;
        background: linear-gradient(90deg,
          #E5A64A 0 24%, transparent 24% 26%,
          #D96B5F 26% 48%, transparent 48% 50%,
          #9C8BC4 50% 72%, transparent 72% 74%,
          #C77B9B 74% 100%);
      }
      #cth-splash::before { top: 12%; }
      #cth-splash::after { bottom: 12%; transform: scaleX(.72); }
      #cth-splash .mk {
        display: grid; place-items: center; width: 96px; height: 58px;
        background: #E5A64A; color: #0B0A0D;
        border-radius: 30px 4px 4px 30px;
        font-family: "Press Start 2P", monospace; font-size: 13px;
        box-shadow: 44px 0 0 #D96B5F, 72px 0 0 #9C8BC4;
      }
      #cth-splash .title {
        margin-top: 8px;
        font-family: "Press Start 2P", monospace;
        font-size: 16px; letter-spacing: .06em;
      }
      #cth-splash .hint {
        font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
        color: #C9B99A;
      }
      #cth-splash .credit {
        position: absolute; bottom: 4%;
        font-size: 11px; color: #77717E; letter-spacing: .04em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">DC</div>
        <div class="title">DAYSTROM COMMAND</div>
        <div class="hint">bringing bridge systems online…</div>
        <div class="credit">Built from Munder Difflin by Chaitanya Giri</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
